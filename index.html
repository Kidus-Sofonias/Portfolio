    <!-- Splash loader -->
    <style>
      #splash-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #0a0e1a;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #splash-loader.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-logo {
        font-family: 'Playfair Display', serif;
        font-size: 2.2rem;
        letter-spacing: 0.35em;
        color: #e5c07b;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      .splash-bar {
        width: 160px;
        height: 2px;
        background: rgba(212, 168, 83, 0.15);
        overflow: hidden;
        border-radius: 2px;
      }
      .splash-bar-fill {
        height: 100%;
        width: 40%;
        background: #e5c07b;
        border-radius: 2px;
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      .splash-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.65rem;
        letter-spacing: 0.3em;
        color: rgba(255, 255, 255, 0.35);
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @keyframes splash-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(450%); }
      }
    </style>
  </head>
  <body>
    <div id="splash-loader">
      <div class="splash-logo">K.S.</div>
      <div class="splash-bar"><div class="splash-bar-fill"></div></div>
      <div class="splash-text">LOADING</div>
    </div>

  </body>
